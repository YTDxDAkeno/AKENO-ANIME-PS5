# ps5-native-app-boilerplate - Lint, build, and release validation.
# Copyright (C) 2026 BlackBearReloaded
# SPDX-License-Identifier: GPL-3.0-or-later
#
# AKENO STREAM: lint, host tests (GoogleTest with ASan/UBSan, local HTTP
# server, software decoder), the PS5 build with its import-binding guard,
# interface screenshots, and the installable PPSA99276 folder ZIP.

name: Build

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 800M

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 lld-18 libclang-rt-18-dev make ninja-build \
            ccache pkg-config tar unzip wget ffmpeg libfreetype-dev libcurl4-openssl-dev libssl-dev zlib1g-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Restore dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/native
            .deps/test
            .deps/pacbrew
            .deps/MkPFS
            .deps/ffmpeg-ps5
            .deps/ffmpeg-host
          key: deps-${{ runner.os }}-${{ runner.arch }}-ubuntu24-clang18-${{ hashFiles('tools/setup-*.sh') }}

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang18-

      - name: Configure parallel compilation
        run: |
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Read app identity and version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id == PPSA99276 ]] || { echo "unexpected title ID: $title_id" >&2; exit 2; }
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"

      # A pull request's build is named by its number and its own commit, on the
      # artifact and inside the app (docs/PULL_REQUEST_BUILDS.md); the version in
      # param.json stays the release's.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=AKENO-STREAM-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            if [[ $GITHUB_REF_TYPE != tag ]]; then
              branch=${GITHUB_REF_NAME##*/}
              branch=${branch//[^A-Za-z0-9._-]/-}
              echo "BUILD_LABEL=${branch:0:30} ${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Lint source and metadata
        run: LINT_SKIP_TIDY=1 make lint

      - name: Run host GoogleTest suite (player, HLS, FFmpeg, providers, UI)
        run: make test-unit

      - name: Run host integration tests
        run: make test-integration

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      # The ZIP is the one release format. "make app" also checks that no import
      # binds to a module native titles cannot use (tools/check-imports.py).
      - name: Build the PS5 folder and ZIP
        run: make app

      - name: Check the package contents
        shell: bash
        run: |
          set -euo pipefail
          listing=$(python3 -m zipfile -l "dist/$TITLE_ID.zip")
          for entry in eboot.bin sce_sys/param.json sce_sys/icon0.png sce_module/libc.prx \
              assets/fonts/Inter-Regular.ttf assets/selftest/av-sync-720p.ts LICENSE THIRD_PARTY_NOTICES.md \
              sources-example.txt; do
            grep -Fq "$TITLE_ID/$entry" <<<"$listing" || { echo "missing $entry" >&2; exit 1; }
          done
          if grep -q PPSA99999 <<<"$listing"; then echo "obsolete PPSA99999 packaged" >&2; exit 1; fi
          # The app ships no sources and must never overwrite the user's.
          if grep -Eq "$TITLE_ID/(sources\.(txt|json)|streams\.json)" <<<"$listing"; then
            echo "a source list is packaged" >&2; exit 1
          fi

      - name: Render interface screenshots
        run: make screenshots

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Write release checksums
        run: cd dist && sha256sum "$TITLE_ID.zip" > SHA256SUMS

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # llvm-pie.elf keeps the symbols that turn a crash report's eboot+0x...
      # offsets into function names (llvm-symbolizer-18 --obj llvm-pie.elf 0x...).
      - name: Upload screenshots, import table and symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}-screenshots
          path: |
            build/screenshots/*.png
            build/imports.txt
            build/llvm-pie.elf
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "AKENO-STREAM-$GITHUB_SHA"
          --dir release

      - name: Prepare release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          if (( ${#files[@]} != 2 )); then
            echo "Expected exactly one app-folder ZIP and SHA256SUMS." >&2
            exit 1
          fi
          shopt -s nullglob
          folder_zips=(PPSA*.zip dist/PPSA*.zip)
          checksums=(SHA256SUMS dist/SHA256SUMS)
          if (( ${#folder_zips[@]} != 1 || ${#checksums[@]} != 1 )); then
            echo "Release files must be one app-folder ZIP and SHA256SUMS." >&2
            exit 1
          fi
          (cd "$(dirname "${checksums[0]}")" && sha256sum -c SHA256SUMS)
          echo "folder_zip=${folder_zips[0]}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksums[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FOLDER_ZIP: ${{ steps.package.outputs.folder_zip }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("release/$FOLDER_ZIP" "release/$CHECKSUM")
          folder_zip_name="${FOLDER_ZIP##*/}"
          checksum_name="${CHECKSUM##*/}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r old_asset; do
              if [[ $old_asset != "$folder_zip_name" && $old_asset != "$checksum_name" ]]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$old_asset" --yes --repo "$GITHUB_REPOSITORY"
              fi
            done < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "AKENO STREAM $GITHUB_REF_NAME"
          fi
